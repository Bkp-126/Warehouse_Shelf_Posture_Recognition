name: Engineering checks

on:
  push:
    branches: [main, codex/portfolio-v1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-cpu:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install CPU dependencies
        shell: pwsh
        run: |
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: python -m pip check
      - run: python -m ruff check src scripts tests
      - name: Test rules, storage, and Qt with generated inputs
        run: python -m pytest -q --junitxml=output/ci-tests.xml
